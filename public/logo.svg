<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="jg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="55%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="jgfill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- Browser window body -->
  <rect x="4" y="3" width="30" height="24" rx="4" fill="url(#jgfill)"/>
  <rect x="4" y="3" width="30" height="24" rx="4" stroke="url(#jg)" stroke-width="2"/>

  <!-- Title bar separator -->
  <line x1="4" y1="11" x2="34" y2="11" stroke="url(#jg)" stroke-width="1.2" opacity="0.5"/>

  <!-- Window dots -->
  <circle cx="9.5"  cy="7.5" r="1.5" fill="url(#jg)"/>
  <circle cx="14.5" cy="7.5" r="1.5" fill="url(#jg)"/>
  <circle cx="19.5" cy="7.5" r="1.5" fill="url(#jg)"/>

  <!-- Content rows inside window -->
  <rect x="9" y="15" width="18" height="2" rx="1" fill="url(#jg)" opacity="0.55"/>
  <rect x="9" y="19" width="12" height="2" rx="1" fill="url(#jg)" opacity="0.35"/>

  <!-- J vertical stem -->
  <line x1="28" y1="27" x2="28" y2="38" stroke="url(#jg)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- J curve at bottom -->
  <path d="M 28 38 Q 28 44 22 44 Q 16 44 16 39" stroke="url(#jg)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pixel / speed-line accents (right side) -->
  <rect x="36" y="7"  width="4" height="4" rx="1" fill="url(#jg)" opacity="0.7"/>
  <rect x="41" y="4"  width="2.5" height="2.5" rx="0.5" fill="url(#jg)" opacity="0.4"/>
  <rect x="40" y="12" width="2.5" height="2.5" rx="0.5" fill="url(#jg)" opacity="0.5"/>
  <rect x="36" y="13" width="3" height="1.5" rx="0.5" fill="url(#jg)" opacity="0.3"/>

  <!-- Speed lines -->
  <line x1="35" y1="18" x2="44" y2="18" stroke="url(#jg)" stroke-width="1.2" stroke-linecap="round" opacity="0.35"/>
  <line x1="36" y1="21" x2="43" y2="21" stroke="url(#jg)" stroke-width="1"   stroke-linecap="round" opacity="0.25"/>
</svg>
